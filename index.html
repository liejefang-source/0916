<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruchard's Farm</title>
    <!-- Use a pixel font to simulate Stardew Valley style -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <div class="wood-board menu-panel">
            <h1 class="greeting">Ruchard's Farm</h1>
            <p class="subtitle">Level 10 Web Farmer</p>

            <div class="time-widget wood-board inner-panel">
                <div class="clock" id="clock">00:00:00</div>
                <div class="date" id="date">Day, Month DD, Year</div>
            </div>

            <div class="inventory">
                <button class="pixel-btn">Talk</button>
                <button class="pixel-btn">Gifts</button>
            </div>

            <!-- Stardew style decorative elements -->
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
