<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李家豐 - NEON CITY</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="cyber-grid"></div>

    <main class="container">
        <div class="cyber-panel">
            <h1 class="greeting glitch" data-text="李家豐">李家豐</h1>
            <p class="subtitle cyber-text_color">SYSTEM.ADMIN <span>// ONLINE</span></p>

            <div class="time-widget">
                <div class="glitch-wrapper">
                    <div class="clock cyber-glitch" id="clock">00:00:00</div>
                </div>
                <!-- The script uses getElementById('date') to update -->
                <div class="date" id="date">Day, Month DD, Year</div>
            </div>

            <div class="actions">
                <button class="cyber-btn">
                    ACCESS DATABANK
                </button>
            </div>

            <!-- decorative elements -->
            <div class="scanner"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
