<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李家豐 - NEON CITY</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="cyber-grid"></div>

    <main class="container">
        <div class="cyber-panel">
            <h1 class="greeting glitch" data-text="李家豐">李家豐</h1>
            <p class="subtitle cyber-text_color">中興電機工程研究所 <span>// 學生</span></p>

            <div class="info-grid">
                <div class="cyber-block">
                    <p class="block-title">>> SYSTEM_ID</p>
                    <p>NID: <span class="highlight">7115064167</span></p>
                    <p>STATUS: <span class="highlight">ACTIVE</span></p>
                </div>

                <div class="cyber-block">
                    <p class="block-title">>> SKILL_TREE</p>
                    <div class="tags">
                        <span class="cyber-tag">Python</span>
                        <span class="cyber-tag">C</span>
                        <span class="cyber-tag">C++</span>
                        <span class="cyber-tag">Web Dev</span>
                    </div>
                </div>
            </div>

            <div class="cyber-block projects-block">
                <p class="block-title">>> DATABANK: UNIV_PROJECTS</p>
                <ul class="cyber-list">
                    <li>> [ DATA_CORRUPTED. ENTER_PROJECT_1_NAME ]</li>
                    <li>> [ DATA_CORRUPTED. ENTER_PROJECT_2_NAME ]</li>
                </ul>
            </div>

            <div class="time-widget">
                <div class="glitch-wrapper">
                    <div class="clock cyber-glitch" id="clock">00:00:00</div>
                </div>
                <!-- The script uses getElementById('date') to update -->
                <div class="date" id="date">Day, Month DD, Year</div>
            </div>

            <div class="actions">
                <button class="cyber-btn">
                    ACCESS DATABANK
                </button>
            </div>

            <!-- decorative elements -->
            <div class="scanner"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
